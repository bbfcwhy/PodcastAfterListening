#:schema node_modules/wrangler/config-schema.json
name = "podcastafterlistening"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# 2026-10-22 威爾決定網站暫時下線，等平台與套件的資安問題修好、更新版本後再重新上線。
# 重新上線：兩個都改回 true，跑 npx wrangler triggers deploy，再到 GitHub 重新啟用 Deploy workflow。
workers_dev = false
preview_urls = false

# Uncomment to enable KV-based ISR caching
# [[kv_namespaces]]
# binding = "NEXT_CACHE_WORKERS_KV"
# id = "<your-kv-namespace-id>"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
